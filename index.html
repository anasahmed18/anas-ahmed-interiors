<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="joke-box">
            <h1>😂 Joke Generator</h1>
            <p class="joke-text" id="jokeText">Click the button to get a random joke!</p>
            <button class="btn" id="jokeBtn">Get a Joke</button>
            <button class="btn btn-secondary" id="copyBtn">Copy Joke</button>
            <p class="loading" id="loading" style="display: none;">Loading...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
